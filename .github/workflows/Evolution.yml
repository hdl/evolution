name: Evolution

on:
  workflow_call:
    inputs:
      tasks:
        required: false
        type: string

jobs:

  Logs:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.logs.outputs.jobs }}
    steps:
    - uses: $/logs
      id: logs
      with:
        tasks: ${{ inputs.tasks }}

  Videos:
    needs: Logs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.Logs.outputs.jobs) }}
    name: ${{ matrix.name }} | ${{ matrix.title }}
    steps:
    - uses: $/video
      with:
        artifact: glogs
        job: ${{ toJSON(matrix) }}
