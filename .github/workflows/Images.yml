name: Images

on:
  push:
    paths:
      - '.github/workflows/Images.yml'
      - 'Dockerfile'
      - 'xrun.sh'
  schedule:
    - cron: '0 0 * * 4'
  workflow_dispatch:

jobs:

  Gource:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v7

    - uses: pyTooling/Actions/with-post-step@r9
      with:
        main: |
          docker build -t ghcr.io/hdl/gource/xrun .
          echo '${{ github.token }}' | docker login ghcr.io -u gha --password-stdin
          docker push ghcr.io/hdl/gource/xrun
        post: docker logout ghcr.io
