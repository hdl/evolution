name: Gource

on:
  push:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:


  Logs:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.logs.outputs.jobs }}
    steps:

    - uses: actions/checkout@v7

    - uses: $/logs
      id: logs
      with:
        config: config.yml
        mailmap: .mailmap
        tasks: |
          ghdl
          nvc


  Videos:
    needs: Logs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.Logs.outputs.jobs) }}
    name: ${{ matrix.name }} | ${{ matrix.title }}
    steps:
    - uses: $/video
      with:
        artifact: glogs
        job: ${{ toJSON(matrix) }}


  Release:
    needs: Videos
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v7
      with:
        path: artifact
    - run: |
        cd artifact
        tar czvf glogs.tar.gz glogs
        rm -rf glogs
        find . -size +2G -exec rm {} \;
    - uses: pyTooling/Actions/releaser@r6
      with:
        token: ${{ github.token }}
        files: artifact/**/*
        tag: gource-videos
