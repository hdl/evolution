name: Gource and FFmpeg
description: Generate a video from the (combined) logs of SCM repositories.
inputs:
  artifact:
    description: Name of the artifact containing the logs.
    required: false
    default: glogs
  job:
    description: String JSON with fields 'name', 'title', 'tree' and 'args'.
    required: true

runs:
  using: 'composite'
  steps:

    - uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.artifact }}
        path: /tmp/glogs

    - shell: bash
      id: job
      run: ${{ github.action_path }}/video.py
      env:
        HDLE_JOB: ${{ inputs.job }}

    - uses: actions/upload-artifact@v6
      with:
        name: ${{ steps.job.outputs.name }}
        path: ${{ steps.job.outputs.artifacts }}
        if-no-files-found: error
