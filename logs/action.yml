name: Get logs and prepare jobs metadata

inputs:
  tasks:
    description: List of videos to generate.
    required: false

outputs:
  jobs:
    value: ${{ steps.logs.outputs.jobs }}

runs:
  using: 'composite'
  steps:

    - uses: actions/download-artifact@v7
      with:
        name: hdle-config
        path: hdle-config

    - shell: bash
      id: logs
      env:
        HDLE_TASKS: ${{ inputs.tasks }}
      run: |
        if [ -f 'hdle-config/.mailmap' ]; then export HDLE_MAILMAP=/tmp/hdle/.mailmap; fi
        docker run --rm \
          -v "${{ github.action_path }}:/action:ro" \
          -v "${{ runner.temp }}/glogs:/tmp/glogs" \
          -v "$(pwd)/hdle-config":/tmp/hdle \
          -v "$GITHUB_OUTPUT:/github_output" \
          -e GITHUB_OUTPUT=/github_output \
          -e HDLE_CONFIG=/tmp/hdle/config.yml \
          -e HDLE_MAILMAP \
          -e HDLE_TASKS \
          ghcr.io/umarcor/gource/xrun \
          /action/logs.py

    - uses: actions/upload-artifact@v6
      with:
        name: glogs
        path: ${{ runner.temp }}/glogs
