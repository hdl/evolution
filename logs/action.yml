name: Get logs and prepare jobs metadata

inputs:
  config:
    description: YAML dictionary with fields 'title', 'tree' and 'args'.
    required: true
  tasks:
    description: List of videos to generate.
    required: false
  mailmap:
    required: false

outputs:
  jobs:
    value: ${{ steps.logs.outputs.jobs }}

runs:
  using: 'composite'
  steps:

    - shell: bash
      id: logs
      env:
        HDLE_TASKS: ${{ inputs.tasks }}
      run: |
        TMP_HDLE='${{ runner.temp }}/hdle'
        mkdir -p "$TMP_HDLE"
        cp '${{ inputs.config }}' "$TMP_HDLE"/config.yaml
        if [[ -n '${{ inputs.mailmap }}' ]]; then
          cp '${{ inputs.mailmap }}' "$TMP_HDLE"/.mailmap
          export HDLE_MAILMAP=/tmp/hdle/.mailmap
        fi
        docker run --rm \
          -v "${{ github.action_path }}:/action:ro" \
          -v "${{ runner.temp }}:/tmp" \
          -v "$GITHUB_OUTPUT:/github_output" \
          -e GITHUB_OUTPUT=/github_output \
          -e HDLE_CONFIG=/tmp/hdle/config.yaml \
          -e HDLE_MAILMAP \
          -e HDLE_TASKS \
          ghcr.io/umarcor/gource/xrun \
          /action/logs.py

    - uses: actions/upload-artifact@v6
      with:
        name: glogs
        path: ${{ runner.temp }}/glogs
